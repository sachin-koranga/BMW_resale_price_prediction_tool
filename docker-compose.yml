version: "3.9"

services:

  backend:
    build: .
    container_name: bmw-fastapi

    ports:
      - "8000:8000"

    restart: always


  frontend:
    build: .
    container_name: bmw-streamlit

    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: always